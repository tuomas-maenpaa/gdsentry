<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <title>Coverage Report</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { color: #333; }
    .summary { background: white; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
    .total { font-size: 24px; font-weight: bold; margin: 15px 0; }
    .good { color: #28a745; }
    .ok { color: #ffc107; }
    .bad { color: #dc3545; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #007bff; color: white; font-weight: bold; }
    tr:hover { background: #f8f9fa; }
    .percent { font-weight: bold; }
    .bar { height: 20px; background: #e9ecef; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.3s; }
  </style>
</head>
<body>
  <h1>📊 Code Coverage Report</h1>
  <div class='summary'>
    <div class='total'>
      Total Coverage: <span class='ok'>70.8%</span>
    </div>
    <p>177 / 250 lines covered</p>
    <div class='bar'>
      <div class='bar-fill' style='width: 70.8%; background: #ffc107;'></div>
    </div>
  </div>
  <h2>Coverage by File</h2>
  <table>
    <thead>
      <tr>
        <th>File</th>
        <th>Coverage</th>
        <th>Lines</th>
        <th>Visual</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><strong>math.gd</strong></td>
        <td class='percent ok'>70.0%</td>
        <td>35 / 50</td>
        <td>
          <div class='bar'>
            <div class='bar-fill' style='width: 70.0%; background: #ffc107;'></div>
          </div>
        </td>
      </tr>
      <tr>
        <td><strong>player.gd</strong></td>
        <td class='percent ok'>75.0%</td>
        <td>90 / 120</td>
        <td>
          <div class='bar'>
            <div class='bar-fill' style='width: 75.0%; background: #ffc107;'></div>
          </div>
        </td>
      </tr>
      <tr>
        <td><strong>enemy.gd</strong></td>
        <td class='percent ok'>65.0%</td>
        <td>52 / 80</td>
        <td>
          <div class='bar'>
            <div class='bar-fill' style='width: 65.0%; background: #ffc107;'></div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  <p style='margin-top: 30px; color: #666; font-size: 12px;'>
    Generated by GDSentry Coverage (Spike 2 Prototype)
  </p>
</body>
</html>
