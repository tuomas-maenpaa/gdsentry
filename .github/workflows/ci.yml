name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Universal cross-platform CI/CD using Podman machines (no Kubernetes/Minikube dependency)
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]  # Both x86_64 and ARM64 runners

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v1
      with:
        version: 4.2.1
        use-dotnet: false

    - name: Install GDSentry CLI
      run: |
        echo "Installing GDSentry CLI..."
        pip install -e ".[dev]"

    - name: Set up development environment
      run: |
        echo "Setting up GDSentry for development..."
        # Make GDSentry importable in development mode
        pip install -e ".[dev]"
        conda develop src || true  # Fallback if conda not available

    - name: Run GDSentry self-tests
      run: |
        echo "Running GDSentry framework self-tests..."
        # Run the framework's own tests to ensure CLI works
        gdsentry test run --scope framework --verbose

    - name: Build containers (optional)
      run: |
        echo "Building test containers..."
        gdsentry build all || echo "Container build failed, continuing with tests"

    - name: Run cross-architecture tests
      run: |
        echo "Running tests on current architecture..."
        gdsentry test run --architecture $(uname -m) --report junit --output test-results/

    - name: Run Python unit tests
      run: |
        echo "Running Python unit tests..."
        python -m pytest tests/unit/ -v --tb=short

    - name: Run type checking
      run: |
        echo "Running mypy type checking..."
        python -m mypy src/ --ignore-missing-imports || echo "Mypy found type issues, continuing..."

    - name: Archive test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ matrix.os }}
        path: |
          test-results/
          *.xml
          *.html
          pytest-results/

  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup conda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: docs/environment.yml
        activate-environment: gdsentry-docs

    - name: Build documentation
      run: |
        conda run -n gdsentry-docs make -C docs html

    - name: Check for broken links
      run: |
        conda run -n gdsentry-docs make -C docs linkcheck

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/build/html
        cname: false
