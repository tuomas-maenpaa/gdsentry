# GDSentry Conda Environment
# Creates the 'gdsentry' conda environment with all dependencies
# Usage: conda env create -f environment.yml && conda activate gdsentry
name: gdsentry
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.12
  - pip

  # CLI Runtime Dependencies
  - rich>=13.7.0
  - pyyaml>=6.0.1
  - jinja2>=3.1.2
  - watchdog>=3.0.0
  
  # Documentation Dependencies
  - sphinx>=7.0
  - sphinx-rtd-theme
  - sphinx-copybutton
  - sphinx-design
  - myst-parser
  
  # Development Dependencies
  - pytest>=8.0.0
  - mypy>=1.8.0
  - ruff>=0.2.0
  
  # Pip-only packages (not available in conda-forge or need specific versions)
  - pip:
    - typer[all]>=0.12.0
    - pydantic>=2.5.0
    - pydantic-settings>=2.1.0
    - tomli>=2.0.1
    - tomli-w>=1.0.0
    - gdscript-docs-maker

